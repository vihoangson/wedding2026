
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hoàng Sơn & Yến Nhi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italiana&family=Jost:wght@300;400;500&display=swap');

  :root{
    --cream:#faf5ec;
    --blush:#e8c4b8;
    --terracotta:#b8734f;
    --sage:#8a9678;
    --ink:#3a3128;
    --gold:#c9a45c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse at top, #fffdf9, var(--cream) 60%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Jost', sans-serif;
    padding:40px 20px;
  }

  .card{
    position:relative;
    width:440px;
    max-width:100%;
    background:#fffefb;
    border:1px solid rgba(184,115,79,0.25);
    padding:56px 40px 44px;
    text-align:center;
    box-shadow: 0 30px 60px -20px rgba(58,49,40,0.25), 0 0 0 1px rgba(255,255,255,0.5) inset;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid var(--gold);
    opacity:0.5;
    pointer-events:none;
  }

  .corner{
    position:absolute;
    width:70px;
    height:70px;
    opacity:0.9;
  }
  .corner svg{ width:100%; height:100%; }
  .tl{ top:-4px; left:-4px; }
  .tr{ top:-4px; right:-4px; transform:scaleX(-1); }
  .bl{ bottom:-4px; left:-4px; transform:scaleY(-1); }
  .br{ bottom:-4px; right:-4px; transform:scale(-1,-1); }

  .eyebrow{
    font-family:'Jost', sans-serif;
    font-size:11px;
    letter-spacing:5px;
    text-transform:uppercase;
    color:var(--terracotta);
    margin-bottom:14px;
  }

  .names{
    font-family:'Italiana', serif;
    font-size:34px;
    color:var(--ink);
    line-height:1.3;
    letter-spacing:1px;
  }

  .amp{
    display:block;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:22px;
    color:var(--sage);
    margin:4px 0;
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:20px auto 26px;
    width:70%;
  }
  .divider .line{ flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent); }
  .divider .leaf{ width:14px; height:14px; color:var(--sage); }

  .qr-wrap{
    position:relative;
    width:220px;
    height:220px;
    margin:0 auto 22px;
    background:#fff;
    padding:14px;
    border:1px solid rgba(138,150,120,0.4);
  }
  .qr-wrap img{
    width:100%;
    height:100%;
    display:block;
  }
  .qr-frame-corner{
    position:absolute;
    width:20px;
    height:20px;
    border-color:var(--terracotta);
  }
  .qr-frame-corner.tl2{ top:-6px; left:-6px; border-top:2px solid; border-left:2px solid; }
  .qr-frame-corner.tr2{ top:-6px; right:-6px; border-top:2px solid; border-right:2px solid; }
  .qr-frame-corner.bl2{ bottom:-6px; left:-6px; border-bottom:2px solid; border-left:2px solid; }
  .qr-frame-corner.br2{ bottom:-6px; right:-6px; border-bottom:2px solid; border-right:2px solid; }

  .caption{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:17px;
    color:var(--ink);
    opacity:0.85;
    margin-bottom:6px;
  }
  .sub{
    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--sage);
  }

  .date-row{
    margin-top:22px;
    font-family:'Cormorant Garamond', serif;
    font-size:15px;
    letter-spacing:2px;
    color:var(--terracotta);
  }
</style>
</head>

    <div class="corner tl">

      </svg>
    </div>
    <div class="corner tr">
      <svg viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 2 Q2 40 40 40" stroke="#c9a45c" stroke-width="1.2" opacity="0.7"/>
        <path d="M2 2 C 20 6, 6 20, 2 2 Z" fill="#8a9678" opacity="0.5"/>
        <circle cx="14" cy="10" r="3" fill="#e8c4b8"/>
        <path d="M2 20 C 14 20, 14 8, 2 2" stroke="#b8734f" stroke-width="1" opacity="0.6"/>
      </svg>
    </div>
    <div class="corner bl">
      <svg viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 2 Q2 40 40 40" stroke="#c9a45c" stroke-width="1.2" opacity="0.7"/>
        <path d="M2 2 C 20 6, 6 20, 2 2 Z" fill="#8a9678" opacity="0.5"/>
        <circle cx="14" cy="10" r="3" fill="#e8c4b8"/>
        <path d="M2 20 C 14 20, 14 8, 2 2" stroke="#b8734f" stroke-width="1" opacity="0.6"/>
      </svg>
    </div>
    <div class="corner br">
      <svg viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 2 Q2 40 40 40" stroke="#c9a45c" stroke-width="1.2" opacity="0.7"/>
        <path d="M2 2 C 20 6, 6 20, 2 2 Z" fill="#8a9678" opacity="0.5"/>
        <circle cx="14" cy="10" r="3" fill="#e8c4b8"/>
        <path d="M2 20 C 14 20, 14 8, 2 2" stroke="#b8734f" stroke-width="1" opacity="0.6"/>
      </svg>
    </div>

    <div class="eyebrow">Save The Date</div>
    <div class="names">Hoàng Sơn<span class="amp">&</span>Yến Nhi</div>

    <div class="divider">
      <span class="line"></span>

      <span class="line"></span>
    </div>

    <div class="qr-wrap">
      <div class="qr-frame-corner tl2"></div>
      <div class="qr-frame-corner tr2"></div>
      <div class="qr-frame-corner bl2"></div>
      <div class="qr-frame-corner br2"></div>
      <img id="qrImg" src="" alt="QR Code thiệp cưới">
    </div>

    <div class="caption">Quét mã để xem thiệp mời</div>
    <div class="sub">Scan For Invitation</div>

    <div class="date-row">— Trân Trọng Kính Mời —</div>
  </div>
